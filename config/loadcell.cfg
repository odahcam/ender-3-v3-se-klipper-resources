# Probe por celula de carga, usando o strain gauge que ja existe na maquina.
#
# Substitui o CR Touch: o gatilho e' o proprio bico tocando a mesa, entao nao ha
# distancia entre probe e bico e x_offset/y_offset sao zero por construcao.
#
# Requer firmware compilado com WANT_HX71X e WANT_LOAD_CELL_PROBE, e numpy no
# klippy-env. Os pinos sao os mesmos que o [hx711s] do prtouch usava:
# sensor0_sdo_pin -> dout_pin, sensor0_clk_pin -> sclk_pin.

[load_cell_probe]
sensor_type: hx711
dout_pin: PC6
sclk_pin: PA4

# Esta celula le compressao como valor negativo: com o bico solto marca -30g e
# encostado na mesa marca -920g. Sem inverter, o gatilho de +75g nunca dispara e
# o Z desce ate travar contra a mesa.
sensor_orientation: inverted

# counts_per_gram e reference_tare_counts sao gravados por LOAD_CELL_CALIBRATE.
# Sem eles o probe recusa a operar - e' proposital, um valor chutado aqui faz o
# bico descer com forca arbitraria contra a mesa.

x_offset: 0
y_offset: 0
z_offset: 0

speed: 3
lift_speed: 10
samples: 3
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_retract_dist: 2

# Forca de disparo, em gramas inteiras (o modulo usa intParamHelper, apesar de a
# doc mostrar 75.0). 75g e' o default: abaixo disso o ruido do HX711 dispara
# sozinho, acima marca a mesa.
trigger_force: 75

# Teto de seguranca: aborta se passar de 2kg contra a mesa.
force_safety_limit: 2000


#####################################################################
#   Homing
#####################################################################
# O load cell nao e' endstop, entao o G28 do eixo Z vira macro: aproxima rapido,
# le o resultado do toque, corrige a posicao e repete devagar para precisao.
# Receita da doc do Klipper (docs/Load_Cell.md, secao "Homing Macros").

# Necessario para SET_KINEMATIC_POSITION, que e' como o _HOME_Z fixa o Z a partir
# do toque. Habilita tambem FORCE_MOVE, que move eixo sem homing - use com juizo.
[force_move]
enable_force_move: True

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% if home_all or 'X' in params %}
      G28 X
    {% endif %}

    {% if home_all or 'Y' in params %}
      G28 Y
    {% endif %}

    {% if home_all or 'Z' in params %}
      _HOME_Z
    {% endif %}

# Esfrega o bico na mesa para tirar o TPU que fica na ponta. Fica na frente a
# direita, longe do X32 Y30 onde o Z e' sondado: com o bico servindo de probe,
# sujar o proprio ponto de sondagem estraga a medida seguinte.
# Exige Z ja homeado - a limpeza anda rente a mesa.
[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set temp = params.TEMP | default(200) | float %}
    {% set z = params.Z | default(0.05) | float %}

    G90
    G1 Z5 F{5 * 60}
    G1 X170 Y25 F{60 * 60}
    M109 S{temp}

    G1 Z{z} F{1 * 60}
    {% for i in range(6) %}
      G1 X200 F{40 * 60}
      G1 X170 F{40 * 60}
    {% endfor %}

    G1 Z5 F{2 * 60}
    M104 S0

# Zera o Z na posicao em que o toolhead parou. Nao usa printer.probe.last_z_result:
# o load_cell_probe classifica a qualidade do tap e devolve null quando reprova,
# o que quebrava a conta e deixava o eixo com a referencia errada - foi assim que
# o bico desceu 200mm e socou a mesa. A posicao do toolhead apos o PROBE e' o
# ponto de contato, valido independente do veredito de qualidade.
[gcode_macro _ZERO_Z_HERE]
gcode:
    SET_KINEMATIC_POSITION Z=0

[gcode_macro _HOME_Z]
gcode:
    SET_GCODE_OFFSET Z=0

    # Assume o Z no topo do curso para poder descer antes de conhecer a posicao.
    SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum[2]}

    # Sonda em cima da celula de carga, nao no centro da mesa: ela fica num ponto
    # fixo e a leitura cai conforme o toque se afasta dali. Mesmas coordenadas
    # que o prtouch usava (sensor_x/sensor_y).
    G90
    G1 X32 Y30 F{60 * 60}

    # Aproximacao em estagios, cada um partindo do resultado do anterior e batendo
    # mais devagar e mais leve. O primeiro toque nao sabe onde a mesa esta e
    # percorre o curso todo, entao e' o unico que precisa ser rapido e firme; a
    # partir dai a distancia e' milimetrica e o que interessa e' deformar pouco a
    # mesa, porque a deformacao entra direto como erro no zero.
    # 10g e' o piso aceito pelo modulo (minval do trigger_force) e o ruido medido
    # e' ~5g, entao o ultimo toque trabalha com 2x de margem sobre o ruido.
    PROBE PROBE_SPEED={5 * 60} SAMPLES=1 TRIGGER_FORCE=75
    _ZERO_Z_HERE

    G91
    G1 Z2 F{1 * 60}
    G90
    PROBE PROBE_SPEED={2 * 60} SAMPLES=1 TRIGGER_FORCE=50
    _ZERO_Z_HERE

    G91
    G1 Z1 F{1 * 60}
    G90
    PROBE PROBE_SPEED={1 * 60} SAMPLES=1 TRIGGER_FORCE=35
    _ZERO_Z_HERE

    G91
    G1 Z0.5 F{1 * 60}
    G90
    PROBE PROBE_SPEED={0.8 * 60} SAMPLES=1 TRIGGER_FORCE=25
    _ZERO_Z_HERE

    G91
    G1 Z0.4 F{1 * 60}
    G90
    PROBE PROBE_SPEED={0.6 * 60} SAMPLES=1 TRIGGER_FORCE=18
    _ZERO_Z_HERE

    G91
    G1 Z0.3 F{1 * 60}
    G90
    PROBE PROBE_SPEED={0.4 * 60} SAMPLES=1 TRIGGER_FORCE=13
    _ZERO_Z_HERE

    G91
    G1 Z0.2 F{1 * 60}
    G90
    PROBE PROBE_SPEED={0.3 * 60} SAMPLES=1 TRIGGER_FORCE=10
    _ZERO_Z_HERE

    G91
    G1 Z10 F{5 * 60}
    G90
